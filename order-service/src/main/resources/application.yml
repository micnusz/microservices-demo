server:
  port: 8082

spring:
  application:
    name: order-service

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 2000

resilience4j:
  circuitbreaker:
    instances:
      userService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

  retry:
    instances:
      userService:
        maxAttempts: 2
        waitDuration: 300ms
        retryExceptions:
          - feign.RetryableException

  bulkhead:
    instances:
      userService:
        maxConcurrentCalls: 10
        maxWaitDuration: 0


logging:
  level:
    com.micnusz.orderservice: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    io.github.resilience4j: DEBUG