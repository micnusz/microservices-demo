server:
  port: 8082

spring:
  application:
    name: order-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 2000

resilience4j:
  timelimiter:
    instances:
      userService:
        timeoutDuration: 2500ms
        cancelRunningFuture: true

  circuitbreaker:
    instances:
      userService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
        eventConsumerBufferSize: 10
        recordExceptions:
          - feign.RetryableException
          - java.net.SocketTimeoutException
          - com.micnusz.orderService.Exception.UserServiceUnavailableException
        ignoreExceptions:
          - com.micnusz.orderService.Exception.UserNotFoundException

  retry:
    instances:
      userService:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - feign.RetryableException
          - java.net.SocketTimeoutException
          - java.net.ConnectException
          - com.micnusz.orderService.Exception.UserServiceUnavailableException
        ignoreExceptions:
          - com.micnusz.orderService.Exception.UserNotFoundException
        eventConsumerBufferSize: 10

  bulkhead:
    instances:
      userService:
        maxConcurrentCalls: 10
        maxWaitDuration: 50ms

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics, circuitbreakerevents, retryevents, bulkheadevents
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
    prometheus:
      enabled: true
    circuitbreakerevents:
      enabled: true
    retryevents:
      enabled: true
    bulkheadevents:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s

logging:
  level:
    com.micnusz.orderservice: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    io.github.resilience4j: DEBUG
    io.github.resilience4j.retry: TRACE